<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interactivo v2</title>
    <style>
        html, body {
            height: 100%; /* Asegurar que html también ocupe altura */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evitar scroll en body */
        }
        body {
            font-family: sans-serif;
            display: flex;
            /* min-height: 100vh; */ /* Reemplazado por height en html, body */
        }

        .panel {
            padding: 15px; 
            box-sizing: border-box; 
            /* overflow-y: auto; */ /* Quitado - Se manejará internamente */
            border: 1px solid #eee; 
            margin: 5px; 
            display: flex; 
            flex-direction: column; 
            min-width: 0; 
            min-height: 0; /* Necesario para flexbox en contenedores con scroll */
        }

        #panel-izquierdo {
            flex: 2; 
            justify-content: center; /* Restaurado para centrar horizontalmente */
            /* align-items: flex-start; */ /* Quitado */
            align-items: center; /* Restaurado para centrar verticalmente */
            overflow: hidden; 
            cursor: grab; 
            position: relative; 
        }

        #panel-izquierdo img {
            object-fit: contain;
            transition: transform 0.1s ease-out;
            transform-origin: center;
            will-change: transform;
            /* max-width: 100%; */ /* Quitado - Conflicto con transform:scale */
            /* max-height: 100%; */ /* Quitado - Conflicto con transform:scale */
            display: block;
        }

        #panel-derecho {
            flex: 3; 
            /* overflow-y: auto; */ /* Quitado */
        }
        
        #panel-carrito {
            flex: 2; 
            background-color: #f9f9f9; 
            /* overflow-y: auto; */ /* Quitado */
        }
        
        /* Hacer que el contenedor de la tabla y la lista del carrito crezcan y scrollen */
        #tabla-container,
        #cart-items-list {
            flex-grow: 1; /* Ocupar espacio vertical restante */
            overflow-y: auto; /* Añadir scroll si es necesario */
            min-height: 0; /* Ayuda a flexbox a calcular tamaño correctamente (RESTAURADO) */
        }
        
        #panel-derecho h2,
        #panel-carrito h2 {
            margin-top: 0;
            flex-shrink: 0; /* Evitar que el título se encoja */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
            font-size: 0.9em; /* Texto tabla un poco más pequeño */
        }

        th {
            background-color: #f2f2f2;
            position: sticky; /* Encabezados fijos */
            top: 0;
        }

        /* Estilos para columna de acciones */
        .actions-cell {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            gap: 5px;
        }
        .quantity-input {
            width: 50px; 
            padding: 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .add-to-cart-btn {
            padding: 4px 8px;
            font-size: 0.85em;
            cursor: pointer;
            background-color: #4CAF50; /* Verde */
            color: white;
            border: none;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        .add-to-cart-btn:hover {
            background-color: #45a049;
        }
        
        /* Estilos para el carrito */
        #cart-items-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #cart-items-list li {
            display: flex; /* DEBUG: Restaurado */
            justify-content: space-between;
            align-items: center;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
            /* border: 1px dashed blue; */ 
            /* min-height: 20px; */      
        }
        #cart-items-list li span {
            flex-shrink: 0; /* DEBUG: Restaurado */
        }
        #cart-items-list li .item-details {
            flex-grow: 1; /* DEBUG: Restaurado */
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
         #cart-items-list li .item-actions button {
            margin-left: 5px;
            padding: 2px 5px;
            font-size: 0.8em;
            cursor: pointer;
         }
        
        /* Estilo para resaltar los números POS en la imagen */
        .highlight-box {
            position: absolute; /* Posicionamiento sobre la imagen */
            border: 2px solid red;
            background-color: rgba(255, 0, 0, 0.2); /* Fondo rojo semitransparente */
            box-sizing: border-box;
            pointer-events: none; /* Para no interferir con clics en la imagen */
            z-index: 10; /* Asegurar que esté sobre la imagen */
            transition: all 0.1s ease-out; /* Suavizar cambios si es necesario */
        }
        
        /* Estilo para las áreas de detección invisibles */
        .pos-hit-area {
            position: absolute;
            background-color: rgba(0, 255, 0, 0.2); /* DEBUG VISUAL: Hacerlas visibles */
            pointer-events: auto; /* Permitir detectar hover */
            cursor: pointer;
            z-index: 5; /* Detrás de resaltados rojos si aún se usan */
        }
        
        /* Estilo para resaltar filas de la tabla */
        .highlight-row {
             background-color: #ffff99 !important; /* Amarillo claro */
             cursor: pointer;
        }

        /* Estilos para Navegación de Sección */
        #catalog-nav {
            display: flex;
            align-items: center;
            padding: 8px 5px;
            margin: 5px;
            border: 1px solid #eee;
            background-color: #e8e8e8;
            gap: 8px;
        }
        #catalog-nav select {
            flex: 1;
            padding: 4px;
            font-size: 0.9em;
        }

        #section-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 5px;
            margin: 5px; /* Margen similar a paneles */
            border: 1px solid #eee;
            background-color: #f9f9f9;
        }
        #section-nav button {
            padding: 5px 10px;
            margin: 0 10px;
            cursor: pointer;
        }
        #section-nav button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        #section-info {
             font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Contenedor General Flex -->
    <div style="display: flex; flex-direction: column; height: 100%;">
        
        <!-- Contenedor para los Paneles (ocupa espacio restante) -->
        <div style="display: flex; flex-grow: 1; min-height: 0;"> 
            <!-- Panel Izquierdo (Imagen) -->
            <div id="panel-izquierdo" class="panel" style="flex: 2;">
                <img id="imagen-catalogo" src="" alt="Dibujo del catálogo">
                <!-- Hit areas y highlights -->
            </div>

            <!-- Contenedor para Paneles Derecho y Carrito (Apilados Verticalmente) -->
            <div style="display: flex; flex-direction: column; flex: 3; min-width: 0;"> 
                
                 <!-- Selector de Catálogo -->
                 <div id="catalog-nav">
                     <label for="catalog-select">Catálogo:</label>
                     <select id="catalog-select">
                         <option value="">Cargando...</option>
                     </select>
                 </div>

                 <!-- Navegación de Sección -->
                 <div id="section-nav">
                    <button id="prev-section-btn" title="Sección Anterior">&lt;&lt;</button>
                    <span id="section-info">Sección -/-</span>
                    <button id="next-section-btn" title="Sección Siguiente">&gt;&gt;</button>
                 </div>

                 <!-- Panel Central (Tabla) -->
                 <div id="panel-derecho" class="panel" style="flex: 3;">
                     <h2 id="table-title">Lista de Piezas</h2>
                     <div id="tabla-container">
                         Cargando...
                     </div>
                 </div>

                 <!-- Panel Derecho (Carrito) - MOVIDO AQUÍ -->
                 <div id="panel-carrito" class="panel" style="flex: 1;"> 
                     <h2>Carrito de Compra</h2>
                     <ul id="cart-items-list">
                         <!-- Items del carrito se añadirán aquí -->
                          <li id="cart-empty-msg">El carrito está vacío.</li>
                     </ul>
                     <!-- Podríamos añadir botones de Vaciar Carrito / Exportar aquí -->
                 </div>
            </div>
        </div>
    </div>

    <script>
        // --- Variables Globales --- 
        let allSections = []; // Almacenará todas las secciones del JSON
        let currentSectionIndex = -1; // Índice de la sección actualmente cargada
        // Variables que dependen de la sección actual (se actualizarán en loadSection)
        let posLocations = {}; 
        let tableData = [];
        let pdfPageDims = { width: 0, height: 0 };
        let currentImagePath = '';
        // --------------------------
        let catalogs = [];
        let currentCatalogId = null;
        const imagenContainer = document.getElementById('panel-izquierdo');
        const imagen = document.getElementById('imagen-catalogo');
        const tablaContainer = document.getElementById('tabla-container');
        const tableTitle = document.getElementById('table-title');
        const prevBtn = document.getElementById('prev-section-btn');
        const nextBtn = document.getElementById('next-section-btn');
        const sectionInfoSpan = document.getElementById('section-info');
        
        // Variables de Zoom/Paneo (sin cambios)
        let scale = 1;
        const minScale = 0.5;
        const maxScale = 5;
        const zoomIntensity = 0.1;
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0; 
        let initialTranslateX = 0, initialTranslateY = 0;

        let cartData = {}; // Objeto para guardar el carrito { partNumber: {description, quantity} }

        // --- Funciones de Zoom/Paneo --- 
        function applyTransform() {
            // Aplicar transform directamente SIN resetear por escala
            imagen.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            
            /* // Lógica anterior comentada
            const currentTranslateX = scale > 1 ? translateX : 0;
            const currentTranslateY = scale > 1 ? translateY : 0;
            imagen.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px) scale(${scale})`;
            if (scale <= 1) { 
                translateX = 0;
                translateY = 0;
            }
            */

            // Actualizar posición/tamaño de las áreas de detección y resaltados
            actualizarHitAreas(); 
            actualizarHighlightBoxes(); // Asegurarse que esta también se llame
        }
        function ajustarImagenInicial() {
            const containerRatio = imagenContainer.offsetWidth / imagenContainer.offsetHeight;
            const imageRatio = imagen.naturalWidth / imagen.naturalHeight;
            
            imagen.style.transform = 'scale(1) translate(0px, 0px)'; // Resetear transform completo
            scale = 1;
            translateX = 0;
            translateY = 0;

            if (imageRatio > containerRatio) {
                scale = imagenContainer.offsetWidth / imagen.naturalWidth;
            } else {
                scale = imagenContainer.offsetHeight / imagen.naturalHeight;
            }
            scale = Math.max(minScale, scale * 0.95);
            applyTransform(); // Aplicar la escala inicial
        }

        // *** RESTAURAR LISTENER DE ZOOM (WHEEL) ***
        imagenContainer.addEventListener('wheel', function(event) {
            event.preventDefault(); 
            const rect = imagenContainer.getBoundingClientRect();
            const mouseX = event.clientX - rect.left; 
            const mouseY = event.clientY - rect.top;  
            
            // Calcular el punto en la imagen (antes del zoom) sobre el que está el cursor
            // Necesitamos calcular el offset desde el centro, similar a calcularPosicionHTML
            const containerCenterX = imagenContainer.offsetWidth / 2;
            const containerCenterY = imagenContainer.offsetHeight / 2;
            const scaledDeltaX = mouseX - containerCenterX - translateX;
            const scaledDeltaY = mouseY - containerCenterY - translateY;
            const imageXOffset = scale ? scaledDeltaX / scale : 0;
            const imageYOffset = scale ? scaledDeltaY / scale : 0;
            const naturalCenterX = imagen.naturalWidth / 2;
            const naturalCenterY = imagen.naturalHeight / 2;
            const imageX = imageXOffset + naturalCenterX;
            const imageY = imageYOffset + naturalCenterY;

            // Calcular nueva escala
            const delta = event.deltaY > 0 ? -zoomIntensity : zoomIntensity;
            // Usar zoom exponencial para mejor sensación
            const newScale = Math.max(minScale, Math.min(maxScale, scale * (1 + delta))); 
            
            // Calcular el nuevo desplazamiento para que el punto bajo el cursor permanezca fijo
            const newScaledDeltaX = (imageX - naturalCenterX) * newScale;
            const newScaledDeltaY = (imageY - naturalCenterY) * newScale;
            translateX = mouseX - containerCenterX - newScaledDeltaX;
            translateY = mouseY - containerCenterY - newScaledDeltaY;
            
            scale = newScale;
            applyTransform(); // Aplica la nueva escala y traslación, y actualiza hit areas
        });

        // --- Lógica de Arrastre (Nueva Estructura) ---
        
        // Función separada para manejar el movimiento durante el arrastre
        function handleDragMove(event) {
             if (!isDragging) return; // Doble chequeo por si acaso
            const currentX = event.clientX;
            const currentY = event.clientY;
            const dx = currentX - startX;
            const dy = currentY - startY;
            translateX = initialTranslateX + dx;
            translateY = initialTranslateY + dy;
            applyTransform();
        }
        
        // Función separada para finalizar el arrastre
        function endDrag() {
            if (isDragging) {
                isDragging = false;
                imagenContainer.style.cursor = 'grab';
                imagen.style.transition = 'transform 0.1s ease-out'; // Reactivar transición
                // Eliminar el listener de mousemove de window
                window.removeEventListener('mousemove', handleDragMove);
                document.removeEventListener('mouseup', handleDragEnd); // También quitar este
            }
        }
        
         // Wrapper para endDrag compatible con event listener
         function handleDragEnd(event) {
             // Asegurarse que fue el botón izquierdo si es mouseup
             if (event && event.button !== 0) return; 
             endDrag();
         }

        // Listener Mousedown: Inicia el arrastre (SIN condición de escala)
        imagenContainer.addEventListener('mousedown', (event) => { 
            if (event.button !== 0) return; 
            
            // --- ELIMINADA CONDICIÓN DE ESCALA --- 
            /* // Código anterior comentado
            const scaleTolerance = 0.01; 
            if (scale <= (1 + scaleTolerance)) {
                 return; // No arrastrar si no está ampliado
            }
            */
            // -------------------------------------
            
            // Prevenir posible selección de texto/imagen por defecto al arrastrar
            event.preventDefault(); 
            
            isDragging = true;
            startX = event.clientX;
            startY = event.clientY;
            initialTranslateX = translateX; 
            initialTranslateY = translateY;
            imagenContainer.style.cursor = 'grabbing'; 
            imagen.style.transition = 'none'; 
            
            // Añadir listeners para mover y soltar AHORA
            window.addEventListener('mousemove', handleDragMove);
            document.addEventListener('mouseup', handleDragEnd); 
        });

        // Listener Mouseleave en el contenedor: También finaliza el arrastre
        imagenContainer.addEventListener('mouseleave', endDrag); // Llama directamente a endDrag

        // --- Función para actualizar Hit Areas --- 
        function actualizarHitAreas() {
            const hitAreas = imagenContainer.querySelectorAll('.pos-hit-area');
            hitAreas.forEach(area => {
                const pos = area.dataset.pos;
                const index = parseInt(area.dataset.index || '0'); // Necesitamos índice si hay múltiples por POS
                if (pos && posLocations[pos] && posLocations[pos][index]) {
                    const bbox = posLocations[pos][index];
                    const coords = calcularPosicionHTML(bbox);
                    if (coords) {
                        area.style.left = `${coords.x}px`;
                        area.style.top = `${coords.y}px`;
                        area.style.width = `${coords.width}px`;
                        area.style.height = `${coords.height}px`;
                    }
                }
            });
             // Actualizar también los highlight-box si todavía se usan
            actualizarHighlightBoxes();
        }

        // --- Función para actualizar Highlight Boxes (si aún se usan para Tabla->Imagen) ---
        function actualizarHighlightBoxes() {
            const highlightBoxes = imagenContainer.querySelectorAll('.highlight-box');
             highlightBoxes.forEach(box => {
                 const pos = box.dataset.highlightPos;
                 const index = parseInt(box.dataset.index || '0'); // Necesitamos índice
                 if (pos && posLocations[pos] && posLocations[pos][index]) {
                     const bbox = posLocations[pos][index];
                     const coords = calcularPosicionHTML(bbox);
                     if (coords) {
                         box.style.left = `${coords.x}px`;
                         box.style.top = `${coords.y}px`;
                         box.style.width = `${coords.width}px`;
                         box.style.height = `${coords.height}px`;
                     }
                 }
             });
        }

        // --- Nueva Lógica de Carga y Selección de Sección --- 

        async function loadInitialData() {
            console.log("Cargando lista de catálogos...");
            const selector = document.getElementById('catalog-select');
            try {
                const response = await fetch('imagenes/catalogs.json');
                if (!response.ok) {
                    throw new Error(`Error al cargar catalogs.json (${response.status})`);
                }
                const data = await response.json();
                catalogs = data.catalogs || [];

                selector.innerHTML = '';

                if (catalogs.length === 0) {
                    const option = document.createElement('option');
                    option.textContent = 'No hay catálogos disponibles';
                    option.disabled = true;
                    option.selected = true;
                    selector.appendChild(option);
                    tablaContainer.innerHTML = '<p>No hay catálogos disponibles. Procesa al menos un PDF con el script de extracción.</p>';
                    return;
                }

                catalogs.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    selector.appendChild(option);
                });

                selector.addEventListener('change', (e) => {
                    if (e.target.value) {
                        switchCatalog(e.target.value);
                    }
                });

                await switchCatalog(catalogs[0].id);

            } catch (error) {
                console.error('Error fatal al cargar catálogos:', error);
                selector.innerHTML = '';
                const option = document.createElement('option');
                option.textContent = 'Error al cargar';
                option.disabled = true;
                option.selected = true;
                selector.appendChild(option);
                tablaContainer.innerHTML = `<p style="color: red;">Error al cargar catálogos: ${error.message}.</p>`;
            }
        }

        async function switchCatalog(catalogId) {
            const catalog = catalogs.find(c => c.id === catalogId);
            if (!catalog) return;

            currentCatalogId = catalogId;
            const jsonPath = `imagenes/${catalogId}/extracted_drawing_data.json`;

            allSections = [];
            currentSectionIndex = -1;
            posLocations = {};
            tableData = [];

            try {
                const response = await fetch(jsonPath);
                if (!response.ok) {
                    throw new Error(`Error al cargar ${jsonPath} (${response.status})`);
                }
                const jsonData = await response.json();

                if (!jsonData || !jsonData.sections || jsonData.sections.length === 0) {
                    throw new Error("El archivo JSON no contiene secciones válidas.");
                }

                allSections = jsonData.sections;
                console.log(`Catálogo "${catalog.name}": ${allSections.length} secciones.`);

                prevBtn.disabled = false;
                nextBtn.disabled = false;

                loadSection(0);

            } catch (error) {
                console.error(`Error al cargar catálogo "${catalog.name}":`, error);
                tablaContainer.innerHTML = `<p style="color: red;">Error al cargar datos del catálogo: ${error.message}</p>`;
                imagen.src = '';
                sectionInfoSpan.textContent = 'Sección -/-';
            }
        }
        
        function loadSection(index) {
             if (index < 0 || index >= allSections.length) {
                 console.error(`Índice de sección inválido: ${index}`);
                 return;
             }
             currentSectionIndex = index;
             const section = allSections[currentSectionIndex];
             console.log(`Cargando sección ${index + 1}/${allSections.length} (Págs. ${section.drawing_page_num}/${section.table_page_num})...`);

             // Actualizar variables globales con datos de esta sección
             posLocations = section.pos_locations || {};
             tableData = section.table_data || [];
             pdfPageDims.width = section.pdf_page_width || 0;
             pdfPageDims.height = section.pdf_page_height || 0;
             currentImagePath = section.image_path || '';
             
             // Actualizar título tabla y texto info sección
             tableTitle.textContent = `Lista de Piezas (Pág. ${section.table_page_num})`;
             sectionInfoSpan.textContent = `Sección ${index + 1} de ${allSections.length} (Págs. ${section.drawing_page_num}/${section.table_page_num})`;

             // Habilitar/deshabilitar botones de navegación
             prevBtn.disabled = (index === 0);
             nextBtn.disabled = (index === allSections.length - 1);

             // Actualizar imagen (importante: esperar a que cargue ANTES de ajustar/crear hit areas)
             imagen.src = currentImagePath;
             // Limpiar hit areas/highlights anteriores mientras carga la nueva imagen
             imagenContainer.querySelectorAll('.pos-hit-area, .highlight-box').forEach(el => el.remove());
             // Resetear zoom/pan al cambiar sección
             scale = 1;
             translateX = 0;
             translateY = 0;

             imagen.onload = () => {
                 console.log(`   Imagen ${currentImagePath} cargada.`);
                 ajustarImagenInicial(); 
                 rebuildTable();       
                 crearHitAreas();      
             };
             imagen.onerror = () => {
                 console.error(`Error al cargar imagen: ${currentImagePath}`);
                 // Mostrar algún mensaje de error en el panel de imagen?
             }
             // Si la imagen ya está en caché y tiene el src correcto, onload puede no dispararse
             // Forzar ejecución si ya está completa con el src correcto
             if (imagen.complete && imagen.src.endsWith(currentImagePath)) {
                 console.log(`   Imagen ${currentImagePath} ya estaba completa.`);
                  ajustarImagenInicial(); 
                  rebuildTable();       
                  crearHitAreas();      
             }
        }

        // --- Función para Reconstruir la Tabla --- 
        function rebuildTable() {
             console.log("   Reconstruyendo tabla...");
             tablaContainer.innerHTML = ''; // Limpiar tabla anterior
             if (tableData.length === 0) {
                 tablaContainer.innerHTML = '<p>No hay datos de tabla para esta sección.</p>';
                 return;
             }
             
             const table = document.createElement('table');
             const thead = table.createTHead();
             const tbody = table.createTBody();
             const headers = Object.keys(tableData[0]);
             const headerRow = thead.insertRow();
             headers.forEach(text => {
                  const th = document.createElement('th');
                  th.textContent = text;
                  headerRow.appendChild(th);
              });
             const thActions = document.createElement('th');
             thActions.textContent = 'Acciones';
             headerRow.appendChild(thActions);

             tableData.forEach((rowData, index) => {
                 const row = tbody.insertRow();
                 const partNumber = rowData['Nº PIEZA / PART NUMBER']; 
                 const description = rowData['DESCRIPCIÓN']; 
                 if (rowData['POS.']) { row.dataset.pos = rowData['POS.']; }
                 headers.forEach(header => { 
                     const cell = row.insertCell();
                     cell.textContent = rowData[header] !== null ? rowData[header] : '';
                  });
                 const cellActions = row.insertCell();
                 cellActions.classList.add('actions-cell');
                 const quantityInput = document.createElement('input');
                 quantityInput.type = 'number';
                 quantityInput.min = '1';
                 quantityInput.value = '1';
                 quantityInput.classList.add('quantity-input');
                 quantityInput.id = `qty-${partNumber || index}`; // ID único
                 const addButton = document.createElement('button');
                 addButton.textContent = 'Añadir';
                 addButton.classList.add('add-to-cart-btn');
                 addButton.onclick = () => {
                     // Validar que tenemos nº pieza
                      if (!partNumber) {
                          alert('No se puede añadir: falta número de pieza.');
                          return;
                      }
                     const quantity = parseInt(quantityInput.value, 10);
                     if (isNaN(quantity) || quantity < 1) {
                         alert('Por favor, introduce una cantidad válida (1 o más).');
                         return;
                     }
                     addToCart(partNumber, description || 'Sin descripción', quantity);
                 };
                 cellActions.appendChild(quantityInput);
                 cellActions.appendChild(addButton);
                 row.addEventListener('mouseover', handleRowHoverStart);
                 row.addEventListener('mouseout', handleRowHoverEnd);
             });
             
             tablaContainer.appendChild(table);
             console.log(`   Tabla reconstruida con ${tableData.length} filas.`);
        }

        // --- Función para Crear Hit Areas (RESTAURADA) --- 
        function crearHitAreas() {
             console.log("   Creando/recreando hit areas..."); // DEBUG
             // Limpiar áreas anteriores si existieran
            imagenContainer.querySelectorAll('.pos-hit-area').forEach(el => el.remove());

            if (!posLocations) {
                 console.warn("   crearHitAreas: posLocations no está definido.");
                 return;
            }

            let createdCount = 0;
            for (const pos in posLocations) {
                const locations = posLocations[pos];
                if (!Array.isArray(locations)) continue; // Seguridad por si acaso
                
                locations.forEach((bbox, index) => {
                     const hitArea = document.createElement('div');
                    hitArea.className = 'pos-hit-area';
                    hitArea.dataset.pos = pos; 
                    hitArea.dataset.index = index; 
                    
                    const coords = calcularPosicionHTML(bbox); 
                    if (coords) {
                        hitArea.style.left = `${coords.x}px`;
                        hitArea.style.top = `${coords.y}px`;
                        hitArea.style.width = `${coords.width}px`;
                        hitArea.style.height = `${coords.height}px`;

                        hitArea.addEventListener('mouseover', handleHitAreaMouseOver);
                        hitArea.addEventListener('mouseout', handleHitAreaMouseOut);

                        imagenContainer.appendChild(hitArea);
                        createdCount++;
                    } else {
                        // console.warn(`No se pudo calcular la posición inicial para POS ${pos}, índice ${index}`);
                    }
                });
            }
            console.log(`   ${createdCount} hit areas creadas.`); // DEBUG
        }

        // --- Nuevas Funciones de Interacción para Tabla -> Imagen --- 
        function handleRowHoverStart(event) {
            const pos = event.currentTarget.dataset.pos;
            if (!pos || !posLocations[pos]) return; 

            // *** Descomentar para resaltar fila ***
            event.currentTarget.classList.add('highlight-row'); 

            // Crear resaltados rojos en la imagen
            const locations = posLocations[pos]; 
            locations.forEach((bbox, index) => { // Necesitamos el índice
                const highlightBox = document.createElement('div');
                highlightBox.className = 'highlight-box';
                highlightBox.dataset.highlightPos = pos; // Para encontrarlo al quitar
                highlightBox.dataset.index = index;      // Para actualizarlo en zoom/pan
                
                const coords = calcularPosicionHTML(bbox);
                if (coords) {
                    highlightBox.style.left = `${coords.x}px`;
                    highlightBox.style.top = `${coords.y}px`;
                    highlightBox.style.width = `${coords.width}px`;
                    highlightBox.style.height = `${coords.height}px`;
                    imagenContainer.appendChild(highlightBox);
                } else {
                     console.warn(`No se pudo calcular la posición para highlight POS ${pos}, índice ${index}`);
                 }
            });
        }

        function handleRowHoverEnd(event) {
            const pos = event.currentTarget.dataset.pos;
            if (!pos) return;

            // *** Descomentar para quitar resaltado fila ***
            event.currentTarget.classList.remove('highlight-row'); 

            // Eliminar todos los resaltados rojos para este POS
            const existingHighlights = imagenContainer.querySelectorAll(`.highlight-box[data-highlight-pos="${pos}"]`);
            existingHighlights.forEach(box => box.remove());
        }

        // --- Funciones de Interacción para HitAreas --- 
        function handleHitAreaMouseOver(event) {
            const pos = event.currentTarget.dataset.pos;
            console.log(`>>> DEBUG: MOUSEOVER en HitArea POS ${pos}`); // DEBUG
            if (!pos) return;

            // Resaltar fila en tabla
            const tablaBody = document.querySelector('#tabla-container tbody');
            if (!tablaBody) {
                 console.log("<<< handleHitAreaMouseOver: No se encontró tbody"); // DEBUG
                 return;
            }
            // Quitar resaltado previo (si lo hubiera)
            const highlightedRow = tablaBody.querySelector('.highlight-row');
            if (highlightedRow) {
                console.log(`    handleHitAreaMouseOver: Quitando highlight de fila POS ${highlightedRow.dataset.pos}`); // DEBUG
                highlightedRow.classList.remove('highlight-row');
            }
            // Resaltar nueva fila
            const targetRow = tablaBody.querySelector(`tr[data-pos="${pos}"]`);
            if (targetRow) {
                 console.log(`    handleHitAreaMouseOver: Añadiendo highlight a fila POS ${pos}`); // DEBUG
                 targetRow.classList.add('highlight-row');
                 // *** Re-activar scroll a la fila ***
                 targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                 // console.log(`HitArea Hover HIT! POS: ${pos}`); // DEBUG (Redundante con el anterior)
            } else {
                console.log(`    handleHitAreaMouseOver: No se encontró targetRow para POS ${pos}`); // DEBUG
            }
             console.log("<<< handleHitAreaMouseOver: Saliendo"); // DEBUG
        }

        function handleHitAreaMouseOut(event) {
             const pos = event.currentTarget.dataset.pos;
            console.log(`>>> DEBUG: MOUSEOUT de HitArea POS ${pos}`); // DEBUG
            if (!pos) return;
            // Quitar resaltado de la fila
             const tablaBody = document.querySelector('#tabla-container tbody');
            if (!tablaBody) {
                 console.log("<<< handleHitAreaMouseOut: No se encontró tbody"); // DEBUG
                 return;
            }
            const targetRow = tablaBody.querySelector(`tr[data-pos="${pos}"]`);
            if (targetRow) {
                 console.log(`    handleHitAreaMouseOut: Quitando highlight de fila POS ${pos}`); // DEBUG
                 targetRow.classList.remove('highlight-row');
            } else {
                 console.log(`    handleHitAreaMouseOut: No se encontró targetRow para POS ${pos}`); // DEBUG
            }
            console.log("<<< handleHitAreaMouseOut: Saliendo"); // DEBUG
        }

        // --- Función Clave: Calcular Coordenadas HTML (Volviendo a V2 - Basada en Centro) --- 
        function calcularPosicionHTML(pdfBbox) {
            if (!imagen.naturalWidth || !imagen.naturalHeight || !pdfPageDims.width || !pdfPageDims.height) {
                // Quitamos el log de error aquí porque puede ser normal al inicio
                return null; 
            }

            const [x0, y0, x1, y1] = pdfBbox;
            const pdfPageWidth = pdfPageDims.width;
            const pdfPageHeight = pdfPageDims.height;

            // 1. Relative position and size in PDF (0-1)
            const relX0 = pdfPageWidth ? x0 / pdfPageWidth : 0;
            const relY0 = pdfPageHeight ? y0 / pdfPageHeight : 0;
            const relWidth = pdfPageWidth ? (x1 - x0) / pdfPageWidth : 0;
            const relHeight = pdfPageHeight ? (y1 - y0) / pdfPageHeight : 0;

            // 2. Position and size in natural image coordinates
            const naturalImgX0 = relX0 * imagen.naturalWidth;
            const naturalImgY0 = relY0 * imagen.naturalHeight;
            const naturalImgWidth = relWidth * imagen.naturalWidth;
            const naturalImgHeight = relHeight * imagen.naturalHeight;

            // 3. Center of the container
            const containerWidth = imagenContainer.offsetWidth;
            const containerHeight = imagenContainer.offsetHeight;
            const containerCenterX = containerWidth / 2;
            const containerCenterY = containerHeight / 2;

            // 4. Center of the natural image
            const naturalCenterX = imagen.naturalWidth / 2;
            const naturalCenterY = imagen.naturalHeight / 2;

            // 5. Offset of the box's top-left from the natural image center
            const deltaX = naturalImgX0 - naturalCenterX;
            const deltaY = naturalImgY0 - naturalCenterY;

            // 6. Scale the offset
            const scaledDeltaX = deltaX * scale;
            const scaledDeltaY = deltaY * scale;

            // 7. Calculate final top-left position relative to container top-left
            const finalX = containerCenterX + scaledDeltaX + translateX;
            const finalY = containerCenterY + scaledDeltaY + translateY;

            // 8. Calculate final width and height
            const finalWidth = naturalImgWidth * scale;
            const finalHeight = naturalImgHeight * scale;
            
            // Devolvemos las coordenadas (sin los logs de debug anteriores)
            return {
                x: Math.round(finalX),
                y: Math.round(finalY),
                width: Math.max(1, Math.round(finalWidth)),
                height: Math.max(1, Math.round(finalHeight))
            };
        }

        // --- Funciones del Carrito --- 
        function addToCart(partNumber, description, quantity) {
            console.log(`>>> addToCart: Añadiendo ${quantity} x ${partNumber}`); // DEBUG
            if (cartData[partNumber]) {
                cartData[partNumber].quantity += quantity;
            } else {
                cartData[partNumber] = { description: description, quantity: quantity };
            }
            console.log('   addToCart: cartData actual:', JSON.stringify(cartData)); // DEBUG
            updateCartDisplay(); 
        }

        function updateCartDisplay() {
            console.log(">>> updateCartDisplay: Actualizando vista del carrito..."); // DEBUG
            const cartList = document.getElementById('cart-items-list');
            // const emptyMsg = document.getElementById('cart-empty-msg'); // Ya no se usa directamente aquí
            
            // --- Alternativa para limpiar la lista --- 
            while (cartList.firstChild) {
                cartList.removeChild(cartList.firstChild);
            }
            // cartList.innerHTML = ''; // Método anterior comentado
            // --------------------------------------

            const cartItems = Object.keys(cartData);
            console.log(`   updateCartDisplay: ${cartItems.length} items en carrito.`); // DEBUG

            if (cartItems.length === 0) {
                 const liEmpty = document.createElement('li');
                 liEmpty.id = 'cart-empty-msg';
                 liEmpty.textContent = 'El carrito está vacío.';
                 cartList.appendChild(liEmpty);
                 console.log("   updateCartDisplay: Carrito vacío, mostrando mensaje."); // DEBUG
            } else {
                cartItems.forEach(partNumber => {
                    const item = cartData[partNumber];
                    const listItem = document.createElement('li');
                    
                    // --- Restaurar HTML Original --- 
                    // listItem.textContent = `Item: ${partNumber} - Qty: ${item.quantity}`; // DEBUG Comentado
                    const itemHTML = `
                        <span class="item-qty">${item.quantity} x</span>
                        <span class="item-details" title="${partNumber} - ${item.description}">
                            <strong>${partNumber}</strong>: ${item.description}
                        </span>
                        <span class="item-actions">
                            <button onclick="changeCartQuantity('${partNumber}', -1)">-</button>
                            <button onclick="changeCartQuantity('${partNumber}', 1)">+</button>
                            <button onclick="removeFromCart('${partNumber}')">X</button>
                        </span>
                    `;
                    listItem.innerHTML = itemHTML;
                    // ------------------------------
                    cartList.appendChild(listItem);
                     console.log(`   updateCartDisplay: Añadido item HTML COMPLEJO para ${partNumber}`); // DEBUG
                });
            }
             console.log("<<< updateCartDisplay: Vista actualizada."); // DEBUG
        }

        function changeCartQuantity(partNumber, change) {
             console.log(`>>> changeCartQuantity: PN=${partNumber}, cambio=${change}`); // DEBUG
             if (!cartData[partNumber]) return;

            const newQuantity = cartData[partNumber].quantity + change;
            if (newQuantity <= 0) {
                 removeFromCart(partNumber);
             } else {
                 cartData[partNumber].quantity = newQuantity;
                  console.log('   changeCartQuantity: cartData actual:', JSON.stringify(cartData)); // DEBUG
                 updateCartDisplay();
             }
        }
        
        function removeFromCart(partNumber) {
            console.log(`>>> removeFromCart: PN=${partNumber}`); // DEBUG
            if (cartData[partNumber]) {
                delete cartData[partNumber];
                 console.log('   removeFromCart: cartData actual:', JSON.stringify(cartData)); // DEBUG
                updateCartDisplay();
            }
        }

        // --- Utilidad: Throttle (SIN USO por ahora) --- 
        function throttle(func, limit) {
            let lastFunc;
            let lastRan;
            return function(...args) {
                const context = this;
                if (!lastRan) {
                    func.apply(context, args);
                    lastRan = Date.now();
                } else {
                    clearTimeout(lastFunc);
                    lastFunc = setTimeout(function() {
                        if ((Date.now() - lastRan) >= limit) {
                            func.apply(context, args);
                            lastRan = Date.now();
                        }
                    }, limit - (Date.now() - lastRan));
                }
            }
        }

        // --- Inicialización Refactorizada --- 
        async function initApp() {
            prevBtn.addEventListener('click', () => {
                if (currentSectionIndex > 0) {
                    loadSection(currentSectionIndex - 1);
                }
            });
            nextBtn.addEventListener('click', () => {
                if (currentSectionIndex < allSections.length - 1) {
                    loadSection(currentSectionIndex + 1);
                }
            });

            await loadInitialData();
        }

        window.addEventListener('resize', ajustarImagenInicial);
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
